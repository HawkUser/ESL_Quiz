function pick(arr,n){return shuffle(arr).slice(0,n);}

// ── QUIZ STATE ────────────────────────────────────────────────────────────────
const TOTAL = 100;
let answered = new Set();
let score = 0;

// Pick 100 random questions, then sort by type for sections
const selected = pick(BANK, TOTAL);
// Assign sections for display grouping
const mcQ    = selected.filter(q=>q.type==='mc');
const fillQ  = selected.filter(q=>q.type==='fill');
const errorQ = selected.filter(q=>q.type==='error');
const quiz   = [...mcQ, ...fillQ, ...errorQ];

// ── BUILD UI ──────────────────────────────────────────────────────────────────
function buildQuiz(){
  const wrap = document.getElementById('quizWrap');
  let lastSection = null;
  const sectionMeta = {
    mc:    {label:'Part A — Choose the correct form', color:'#4361ee'},
    fill:  {label:'Part B — Write the correct form of the verb', color:'#7209b7'},
    error: {label:'Part C — Is the sentence correct or wrong?', color:'#f72585'},
  };

  quiz.forEach((q,i)=>{
    const qNum = i+1;
    if(q.type !== lastSection){
      lastSection = q.type;
      const sm = sectionMeta[q.type];
      const lbl = document.createElement('div');
      lbl.className='section-label';
      lbl.style.borderColor=sm.color;
      lbl.style.color=sm.color;
      lbl.textContent=sm.label;
      wrap.appendChild(lbl);
    }

    const card = document.createElement('div');
    card.className='q-card'; card.id='q'+qNum;

    const num = document.createElement('div');
    num.className='q-num'; num.textContent='Question '+qNum;
    card.appendChild(num);

    const txt = document.createElement('div');
    txt.className='q-text';
    txt.textContent = q.type==='error' ? 'Is this sentence correct or wrong? '+q.text : q.text;
    card.appendChild(txt);

    if(q.type==='mc'){
      const shuffledOpts = shuffle(q.opts.concat([q.ans]).filter((v,i,a)=>a.indexOf(v)===i));
      const optDiv = document.createElement('div'); optDiv.className='opts';
      shuffledOpts.forEach(o=>{
        const btn = document.createElement('button');
        btn.className='opt'; btn.textContent=o;
        btn.onclick=()=>handleMC(btn,qNum,o,q.ans,q.exp);
        optDiv.appendChild(btn);
      });
      card.appendChild(optDiv);

    } else if(q.type==='error'){
      const optDiv = document.createElement('div'); optDiv.className='opts';
      shuffle(['Correct','Wrong']).forEach(o=>{
        const btn = document.createElement('button');
        btn.className='opt';
        btn.textContent = o==='Correct'?'✅ Correct':'❌ Wrong';
        btn.onclick=()=>handleMC(btn,qNum,o,q.ans,q.exp);
        optDiv.appendChild(btn);
      });
      card.appendChild(optDiv);

    } else {
      const fillWrap = document.createElement('div'); fillWrap.className='fill-wrap';
      const inp = document.createElement('input');
      inp.className='fill-input'; inp.id='fi'+qNum;
      inp.placeholder='Type your answer here...';
      inp.oninput=()=>{inp.className='fill-input';document.getElementById('fb'+qNum).textContent='';document.getElementById('ht'+qNum).classList.remove('show');};
      inp.onkeydown=e=>{if(e.key==='Enter')checkFill(qNum,q.ans,q.exp);};
      const cbtn = document.createElement('button');
      cbtn.className='check-btn'; cbtn.id='cb'+qNum; cbtn.textContent='Check ✓';
      cbtn.onclick=()=>checkFill(qNum,q.ans,q.exp);
      fillWrap.appendChild(inp); fillWrap.appendChild(cbtn);
      card.appendChild(fillWrap);
    }

    const fb = document.createElement('div'); fb.className='fb'; fb.id='fb'+qNum; card.appendChild(fb);
    const ht = document.createElement('div'); ht.className='hint'; ht.id='ht'+qNum; card.appendChild(ht);
    wrap.appendChild(card);
  });
}

function handleMC(btn,qNum,chosen,correct,exp){
  if(answered.has(qNum))return;
  answered.add(qNum);
  const card=document.getElementById('q'+qNum);
  const fb=document.getElementById('fb'+qNum);
  const ht=document.getElementById('ht'+qNum);
  card.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(chosen===correct){
    btn.classList.add('ok'); card.classList.add('correct');
    fb.className='fb ok'; fb.textContent='✅ Correct!'; score++;
  } else {
    btn.classList.add('err'); card.classList.add('wrong');
    fb.className='fb err'; fb.textContent='❌ Not quite.';
    // reveal correct — strip emoji prefix for error type
    card.querySelectorAll('.opt').forEach(b=>{
      const raw=b.textContent.replace(/^[✅❌] /,'');
      if(raw===correct||b.textContent===correct) b.classList.add('reveal');
    });
    ht.textContent='📖 '+exp; ht.classList.add('show');
  }
  updateProgress();
}

function checkFill(qNum,accepted,exp){
  if(answered.has(qNum))return;
  const inp=document.getElementById('fi'+qNum);
  const val=norm(inp.value);
  if(!val)return;
  answered.add(qNum);
  const card=document.getElementById('q'+qNum);
  const fb=document.getElementById('fb'+qNum);
  const ht=document.getElementById('ht'+qNum);
  document.getElementById('cb'+qNum).disabled=true;
  inp.disabled=true;
  const ok=accepted.some(a=>norm(a)===val);
  if(ok){
    inp.classList.add('ok'); card.classList.add('correct');
    fb.className='fb ok'; fb.textContent='✅ Correct!'; score++;
  } else {
    inp.classList.add('err'); card.classList.add('wrong');
    fb.className='fb err'; fb.textContent='❌ Answer: "'+accepted[0]+'"';
    ht.textContent='📖 '+exp; ht.classList.add('show');
  }
  updateProgress();
}

function updateProgress(){
  const n=answered.size;
  document.getElementById('pb').style.width=(n/TOTAL*100)+'%';
  document.getElementById('pbLabel').textContent=n+' / '+TOTAL;
  document.getElementById('scoreLive').textContent='Score: '+score+' correct out of '+n+' answered';
  if(n===TOTAL) setTimeout(showScore,700);
}

function showScore(){
  const panel=document.getElementById('scorePanel');
  panel.classList.add('show');
  document.getElementById('scoreBig').textContent=score+'/100';
  const pct=score;
  document.getElementById('scorePct').textContent=pct+'%';
  let msg='';
  if(pct===100) msg='🌟 Perfect! You nailed every single question!';
  else if(pct>=90) msg='🎉 Outstanding! Almost flawless!';
  else if(pct>=80) msg='👏 Great job! Strong understanding of the tenses.';
  else if(pct>=70) msg='👍 Good work! Review the incorrect ones and try again.';
  else if(pct>=60) msg='📚 Decent start — focus on the hints and practice more.';
  else msg='💪 Keep going! Every mistake is a learning opportunity.';
  document.getElementById('scoreMsg').textContent=msg;
  panel.scrollIntoView({behavior:'smooth',block:'center'});
}

buildQuiz();
</script>
